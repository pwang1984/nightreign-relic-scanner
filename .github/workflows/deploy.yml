name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, mint an OIDC token, publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway — a half-published site is worse than a stale
# one — but keep at most a single run queued behind the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Derived from the repo name rather than read from configure-pages'
      # base_path output: that output comes back empty unless the Pages site is
      # already provisioned, and an empty base silently produces a build whose
      # assets point at the domain root instead of /<repo>/.
      - name: Resolve the Pages base path
        run: |
          repo='${{ github.event.repository.name }}'
          owner='${{ github.repository_owner }}'
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          if [ -f public/CNAME ]; then
            # A custom domain serves from its own root.
            base='/'
          elif [ "$(lower "$repo")" = "$(lower "$owner").github.io" ]; then
            # A user/org site is served from the domain root too.
            base='/'
          else
            # Everything else is a project site under /<repo>/.
            base="/$repo/"
          fi

          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "Building for base path: $base"

      - name: Build
        run: npm run build

      # Fail here rather than publishing a site whose assets 404. This is the
      # exact breakage an empty base produces, and it is invisible until load.
      - name: Verify asset URLs carry the base path
        run: |
          if ! grep -q "src=\"${BASE_PATH}assets/" dist/index.html; then
            echo "::error::dist/index.html does not reference ${BASE_PATH} - the deployed site would load assets from the domain root."
            grep -oE '(src|href)="[^"]*"' dist/index.html || true
            exit 1
          fi
          echo "OK - assets are referenced under ${BASE_PATH}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
