name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # OCR over the fixture clips is CPU-bound; this is a backstop against a
    # hung tesseract worker, not a target.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      # In the browser the app pulls frames from an HTMLVideoElement onto a
      # canvas. Outside it, tests/run-test.js shells out to ffmpeg/ffprobe for
      # the same job, so the runner needs both on PATH.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run pipeline tests
        run: npm test
